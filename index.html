<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Box</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #EEE;
        color: #111;
        font-family: 'Courier New', monospace;
    }
    

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .box {
        border: 3px solid #3b82f6;
        padding: 10px;
        overflow-wrap: break-word;
        word-wrap: break-word;
        font-size: 12px;
    }

    .timer-container {
        width: 100%;
        height: 10px;
        background: #ddd;
        margin-top: 10px;
        position: relative;
        overflow: hidden;
    }

    .timer-bar {
        width: 100%;
        height: 100%;
        background: #3b82f6;
    }

    /* Desktop */
    @media (min-width: 600px) {
        .box {
            width: 33vw;
            height: 33vh;
        }

        .timer-container {
            width: 33vw;
        }
    }

    /* Phone */
    @media (max-width: 599px) {
        .box {
            width: 95vw;
            height: 33vh;
        }

        .timer-container {
            width: 95vw;
        }
    }
</style>
</head>

<body>
    
<div id="gameMessage" style="text-align:center; margin-bottom:15px;"></div>
<div class="container">
    <div class="box" id="displayBox"></div>
    <div class="timer-container">
        <div class="timer-bar" id="timerBar"></div>
    </div>
</div>

<script>
let typedNumbers = "";
let timerBar = document.getElementById("timerBar");
let displayBox = document.getElementById("displayBox");

let startTime;
const duration = 5000;
let animationFrame;
let gameActive = true;

function animateTimer() {
    let elapsed = Date.now() - startTime;
    let progress = elapsed / duration;

    if (progress >= 1) {
        progress = 1;
        endGame();
    }

    timerBar.style.width = (100 - progress * 100) + "%";

    if (progress < 1 && gameActive) {
        animationFrame = requestAnimationFrame(animateTimer);
    }
}

function startTimer() {
    cancelAnimationFrame(animationFrame);
    startTime = Date.now();
    timerBar.style.width = "100%";
    animationFrame = requestAnimationFrame(animateTimer);
}

function endGame() {
    gameActive = false;
    cancelAnimationFrame(animationFrame);

    document.getElementById("gameMessage").innerHTML = `
        <div style="font-size:24px; margin-bottom:10px;">GAME OVER</div>
        <button onclick="resetGame()">Play Again</button>
    `;
}

function resetGame() {
    typedNumbers = "";
    displayBox.innerText = "";
    document.getElementById("gameMessage").innerHTML = "";
    gameActive = true;
    startTimer();
}

document.addEventListener("keydown", function(event) {
    if (!gameActive) return;

    const key = event.key;

    startTimer();

    if (key >= "0" && key <= "9") {
        typedNumbers += key;
        displayBox.innerText = typedNumbers;
    }

    if (key === "Backspace") {
        typedNumbers = typedNumbers.slice(0, -1);
        displayBox.innerText = typedNumbers;
    }
});

startTimer();
</script>
