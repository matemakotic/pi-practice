<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Box</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #EEE;
        color: #111;
        font-family:  'Courier New', monospace;
    }

    .box {
        border: 3px solid #3b82f6;
        padding: 10px;
        overflow-wrap: break-word;
        word-wrap: break-word;
        font-size: 12px;
    }

    /* Desktop size */
    @media (min-width: 600px) {
        .box {
            width: 33vw;
            height: 33vh;
        }
    }

    /* Phone size */
    @media (max-width: 599px) {
        .box {
            width: 95vw;
            height: 33vh;
        }
    }
</style>
</head>

<body>

<div class="box" id="displayBox"></div>

<script>
let typedNumbers = "";

document.addEventListener("keydown", function(event) {
    const key = event.key;

    // Only allow digits 0–9
    if (key >= "0" && key <= "9") {
        typedNumbers += key;
        document.getElementById("displayBox").innerText = typedNumbers;
    }

    // Backspace support
    if (key === "Backspace") {
        typedNumbers = typedNumbers.slice(0, -1);
        document.getElementById("displayBox").innerText = typedNumbers;
    }
});
</script>

</body>
</html>
