<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Box with Vertical Timer</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #EEE;
        color: #111;
        font-family: 'Courier New', monospace;
    }

    .container {
        display: flex;
        flex-direction: row; /* side by side */
        align-items: flex-start;
    }

    .box {
        border: 3px solid #3b82f6;
        padding: 10px;
        overflow-wrap: break-word;
        word-wrap: break-word;
        font-size: 12px;
    }

    /* Vertical timer container */
    .timer-container {
        width: 15px; /* thin vertical bar */
        margin-left: 10px;
        height: 33vh; /* match box height */
        background: #ddd;
        position: relative;
        overflow: hidden;
    }

    .timer-bar {
        width: 100%;
        height: 100%;
        background: #3b82f6;
        position: absolute;
        top: 0; /* starts full height, shrinks downward */
    }

    /* Desktop size */
    @media (min-width: 600px) {
        .box {
            width: 33vw;
            height: 33vh;
        }
        .timer-container {
            height: 33vh;
        }
    }

    /* Phone size */
    @media (max-width: 599px) {
        .box {
            width: 70vw;
            height: 33vh;
        }
        .timer-container {
            height: 33vh;
        }
    }

    #gameMessage {
        text-align: center;
        margin-bottom: 15px;
        font-size: 24px;
    }
</style>
</head>

<body>

<div>
    <div id="gameMessage"></div>
    <div class="container">
        <div class="box" id="displayBox"></div>
        <div class="timer-container">
            <div class="timer-bar" id="timerBar"></div>
        </div>
    </div>
</div>

<script>
let typedNumbers = "";
let timerBar = document.getElementById("timerBar");
let displayBox = document.getElementById("displayBox");
let gameActive = true;

const duration = 5000; // 5 seconds
let startTime;
let animationFrame;

function animateTimer() {
    let elapsed = Date.now() - startTime;
    let progress = elapsed / duration;

    if (progress >= 1) {
        progress = 1;
        endGame();
    }

    // Shrink bar height from 100% → 0%
    timerBar.style.height = (100 - progress * 100) + "%";

    if (progress < 1 && gameActive) {
        animationFrame = requestAnimationFrame(animateTimer);
    }
}

function startTimer() {
    cancelAnimationFrame(animationFrame);
    startTime = Date.now();
    timerBar.style.height = "100%";
    animationFrame = requestAnimationFrame(animateTimer);
}

function resetTimer() {
    if (!gameActive) return;
    timerBar.style.height = "100%";
    startTimer();
}

function endGame() {
    gameActive = false;
    cancelAnimationFrame(animationFrame);
    document.getElementById("gameMessage").innerHTML = `
        <div>GAME OVER</div>
        <button onclick="resetGame()">Play Again</button>
    `;
}

function resetGame() {
    typedNumbers = "";
    displayBox.innerText = "";
    document.getElementById("gameMessage").innerHTML = "";
    gameActive = true;
    startTimer();
}

document.addEventListener("keydown", function(event) {
    if (!gameActive) return;

    const key = event.key;

    resetTimer(); // reset on any key

    if (key >= "0" && key <= "9") {
        typedNumbers += key;
        displayBox.innerText = typedNumbers;
    }

    if (key === "Backspace") {
        typedNumbers = typedNumbers.slice(0, -1);
        displayBox.innerText = typedNumbers;
    }
});

// Start timer immediately
startTimer();
</script>

</body>
</html>
